# TCM-Test 项目 Docker Compose 配置
# 包含前端、后端和数据库服务

version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    container_name: tcm-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Rhinox
      POSTGRES_DB: tcm_files
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB 数据库
  mongodb:
    container_name: tcm-mongodb
    image: mongo:7-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Rhinox
      MONGO_INITDB_DATABASE: tcm-obsidian
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    container_name: tcm-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j 知识图谱数据库
  neo4j:
    container_name: tcm-neo4j
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/Rhinoceros
      NEO4J_PLUGINS: '["apoc", "gds"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务 (NestJS)
  backend:
    container_name: tcm-backend
    build:
      context: ./back
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      # 数据库配置
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Rhinox
      POSTGRES_DB: tcm_files
      USE_POSTGRES_STORAGE: "true"

      # MongoDB 配置
      MONGO_URI: mongodb://admin:Rhinox@mongodb:27017/tcm-obsidian?authSource=admin

      # Redis 配置
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Neo4j 配置
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: Rhinoceros
      KNOWLEDGE_GRAPH_ENABLED: "true"

      # JWT 配置
      JWT_SECRET: supersecretkey
      PORT: 3001

      # LLM 配置 (需要用户自行配置)
      LLM_BINDING: ${LLM_BINDING:-openai}
      LLM_MODEL: ${LLM_MODEL:-kimi-k2.5}
      LLM_BINDING_HOST: ${LLM_BINDING_HOST:-}
      LLM_BINDING_API_KEY: ${LLM_BINDING_API_KEY:-}

      # Embedding 配置
      EMBEDDING_BINDING: ${EMBEDDING_BINDING:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      EMBEDDING_BINDING_HOST: ${EMBEDDING_BINDING_HOST:-}
      EMBEDDING_BINDING_API_KEY: ${EMBEDDING_BINDING_API_KEY:-}

      # RAG 配置
      RAG_DEFAULT_QUERY_MODE: ${RAG_DEFAULT_QUERY_MODE:-mix}
      RAG_TOP_K: ${RAG_TOP_K:-10}

      # Rerank 配置
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-aliyun}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-qwen3-rerank}

    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 前端服务 (Nginx)
  frontend:
    container_name: tcm-frontend
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      # API 配置
      VITE_API_BASE_URL: http://backend:3001
    depends_on:
      - backend
    restart: unless-stopped

# 数据卷定义
volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
